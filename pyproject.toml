[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hackthebruh"
version = "0.1.0"
description = "Polymarket finance data and point-in-time wallet research"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "python-dotenv>=1.0",
    "supabase>=2.0",
    "uvicorn>=0.30",
]

[project.scripts]
polyresearch = "polyresearch.cli:main"

[tool.setuptools.packages.find]
include = ["polyresearch*"]
