<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="t d"><title id="t">Interactive demo overview</title><desc id="d">Illustration of the implemented historical results explorer, not a browser screenshot. Market selection, observed and predicted counts, wallet groups and searchable data are available.</desc><rect width="1200" height="650" rx="18" fill="#101719"/><g font-family="Arial, sans-serif"><text x="43" y="48" fill="#f0f2e9" font-size="16" font-weight="700" letter-spacing="2">↗ HACKTHEBRUH</text><text x="862" y="46" fill="#a8b3ad" font-size="12">EXPERIMENT / DATA ROOM</text><path d="M43 68h1114" stroke="#354144"/><text x="43" y="114" fill="#b9eab2" font-size="13" letter-spacing="2">INTERACTIVE HISTORICAL RESULTS</text><text x="43" y="184" fill="#f0f2e9" font-size="65">Who trades</text><text x="43" y="252" fill="#b9eab2" font-size="65" font-style="italic" font-family="Georgia, serif">next?</text><text x="46" y="297" fill="#a8b3ad" font-size="19">100 earlier markets → 20 later reality checks</text><rect x="44" y="327" width="358" height="48" rx="4" fill="#b9eab2"/><text x="66" y="358" fill="#101719" font-size="16" font-weight="700">Pick a market. Compare the counts. ↓</text><rect x="620" y="102" width="536" height="291" rx="7" fill="#182124" stroke="#354144"/><text x="645" y="138" fill="#f0f2e9" font-size="19">PREDICTED VS. OBSERVED</text><text x="645" y="164" fill="#a8b3ad" font-size="12">Same 80 group / action counts · lower error is better</text><text x="645" y="216" fill="#f0f2e9" font-size="16">Model</text><rect x="747" y="197" width="199" height="24" fill="#b9eab2" rx="3"/><text x="1033" y="216" fill="#f0f2e9" font-size="22">1.57</text><text x="645" y="269" fill="#f0f2e9" font-size="16">Baseline</text><rect x="747" y="250" width="228" height="24" fill="#edab87" rx="3"/><text x="1033" y="269" fill="#f0f2e9" font-size="22">1.80</text><path d="M645 299h484" stroke="#354144"/><text x="645" y="333" fill="#b9eab2" font-size="20" font-weight="700">12.6% less average count error</text><text x="645" y="364" fill="#a8b3ad" font-size="14">Exploratory result. Labels and coverage remain limited.</text><g fill="#182124" stroke="#354144"><rect x="43" y="430" width="354" height="143" rx="7"/><rect x="423" y="430" width="354" height="143" rx="7"/><rect x="803" y="430" width="354" height="143" rx="7"/></g><g fill="#a8b3ad" font-size="12" letter-spacing="1"><text x="65" y="465">01 / MARKET EXPLORER</text><text x="445" y="465">02 / WALLET EVIDENCE</text><text x="825" y="465">03 / DATA ROOM</text></g><g fill="#f0f2e9" font-size="23"><text x="65" y="507">Predicted ↔ actual</text><text x="445" y="507">1 / 26 / 73</text><text x="825" y="507">120 markets</text></g><g fill="#a8b3ad" font-size="14"><text x="65" y="545">Inspect each buyer / seller count.</text><text x="445" y="545">Stronger / other / unknown proxies</text><text x="825" y="545">Search, filter and page records.</text></g><text x="43" y="620" fill="#a8b3ad" font-size="13">Illustrated overview, not a browser screenshot. Live hosting still requires connected accounts.</text></g></svg>
