<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="490" viewBox="0 0 1200 490" role="img" aria-labelledby="t d"><title id="t">Collect once, query from anywhere</title><desc id="d">Architecture plan: Polymarket feeds Supabase Postgres and Storage, then a Vercel read-only demo. About 117 MB of files fits the 1 GB free file allowance. The separate database limit is 500 MB; actual database size must be measured after import.</desc><rect width="1200" height="490" rx="18" fill="#101719"/><g font-family="Arial, sans-serif"><text x="48" y="52" fill="#b9eab2" font-size="15" letter-spacing="2">COLLECT ONCE · QUERY FROM ANYWHERE</text><text x="48" y="102" fill="#f0f2e9" font-size="33" font-weight="700">The big files stay behind the demo.</text><g fill="#182124" stroke="#354144"><rect x="48" y="152" width="285" height="165" rx="9"/><rect x="458" y="152" width="285" height="165" rx="9"/><rect x="868" y="152" width="285" height="165" rx="9"/></g><g fill="#f0f2e9" font-size="27" font-weight="700"><text x="73" y="195">Polymarket</text><text x="483" y="195">Supabase</text><text x="893" y="195">Vercel</text></g><g fill="#a8b3ad" font-size="17"><text x="73" y="234">Markets · wallets · trades</text><text x="73" y="272">Versioned source snapshots</text><text x="483" y="234">Postgres → queryable rows</text><text x="483" y="272">Storage → compressed files</text><text x="893" y="234">Charts · search · comparison</text><text x="893" y="272">Read-only pages of records</text></g><g stroke="#b9eab2" stroke-width="3" fill="none"><path d="M355 235h78m-10-9 10 9-10 9M765 235h78m-10-9 10 9-10 9"/></g><rect x="48" y="349" width="1105" height="94" rx="9" fill="#263528"/><text x="73" y="384" fill="#b9eab2" font-size="20" font-weight="700">~117 MB of published files / 1 GB Free file allowance</text><text x="73" y="416" fill="#c1d0c1" font-size="16">Database allowance: 500 MB separately. Measure actual tables + indexes after import.</text><text x="48" y="474" fill="#a8b3ad" font-size="13">Deployment plan. Account connections and a verified live deployment are still required.</text></g></svg>
